# InfluxDB API + UI on https://wservices.wavesys.pt:8086
# Install: /etc/apache2/sites-available/dawn6g-influxdb.conf, then a2ensite dawn6g-influxdb
<IfModule ssl_module>
Listen 8086

<VirtualHost *:8086>
    ServerName wservices.wavesys.pt

    SSLEngine on
    # Same certificate as the :443 vhost (certbot paths shown; adjust if yours differ)
    SSLCertificateFile    /etc/letsencrypt/live/wservices.wavesys.pt/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wservices.wavesys.pt/privkey.pem

    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:18086/
    ProxyPassReverse / http://127.0.0.1:18086/

    ErrorLog  ${APACHE_LOG_DIR}/dawn6g-influxdb-error.log
    CustomLog ${APACHE_LOG_DIR}/dawn6g-influxdb-access.log combined
</VirtualHost>
</IfModule>
